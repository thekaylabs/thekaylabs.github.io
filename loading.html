    .loading {
      text-align: center;
      transform: translateY(4vh);
    }

    /* ── 每個字元的容器 ── */
    .loading__title,
    .loading__sub {
      font-family: 'IM Fell French Canon', Georgia, serif;
      font-weight: 400;
      color: #2E2E2E;
      line-height: 1.0;
      letter-spacing: -0.01em;
    }

    .loading__title { font-size: clamp(52px, 7.5vw, 96px); }

    .loading__sub {
      margin-top: 14px;
      font-size: clamp(20px, 2.6vw, 34px);
      letter-spacing: 0.005em;
    }

    /* 每個 span.char 初始透明，JS 控制逐字出現 */
    .char {
      display: inline-block;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.18s ease, transform 0.18s ease;
    }

    .char.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* 空格不能 inline-block 否則會消失，改用特殊處理 */
    .char.space {
      display: inline;
      opacity: 1;
      transform: none;
      transition: none;
    }

    /* ── 橘色滿版覆蓋層：由右至左掃入 ── */
    .orange-sweep {
      position: fixed;
      inset: 0;
      background-color: #FF7423;
      /* 初始：從右邊界外開始，clip-path 遮住全部 */
      clip-path: inset(0 100% 0 0);
      z-index: 100;
      pointer-events: none;
    }

    .orange-sweep.sweep-in {
      clip-path: inset(0 0% 0 0);
      transition: clip-path 1s cubic-bezier(0.76, 0, 0.24, 1);
    }

    .orange-sweep.sweep-out {
      clip-path: inset(0 0 0 100%);
      transition: clip-path 1s cubic-bezier(0.76, 0, 0.24, 1);
    }

<body>

  <div class="loading">
    <h1 class="loading__title" id="title"></h1>
    <p  class="loading__sub"   id="sub"></p>
  </div>

  <div class="orange-sweep" id="sweep"></div>

  <script>
    'use strict';

    /* ── 字元拆解：空格保留為文字節點 ── */
    function buildChars(el, text) {
      el.innerHTML = '';
      text.split('').forEach(function(ch) {
        var span = document.createElement('span');
        if (ch === ' ') {
          span.className = 'char space';
          span.innerHTML = '&nbsp;';
        } else {
          span.className = 'char';
          span.textContent = ch;
        }
        el.appendChild(span);
      });
      return el.querySelectorAll('.char:not(.space)');
    }

    var titleEl = document.getElementById('title');
    var subEl   = document.getElementById('sub');
    var sweep   = document.getElementById('sweep');

    var titleChars = buildChars(titleEl, 'Ctrl + Create');
    var subChars   = buildChars(subEl,   'Not just copy, always create.');

    /* ── 逐字動畫 ── */
    var CHAR_DELAY   = 55;   // 每個字間隔 ms
    var LINE_GAP     = 300;  // 第一行結束後等多久開始第二行
    var AFTER_TYPED  = 800;  // 全部打完後等多久觸發橘色

    function typeChars(chars, startDelay, onDone) {
      Array.from(chars).forEach(function(ch, i) {
        setTimeout(function() {
          ch.classList.add('visible');
          if (i === chars.length - 1 && onDone) {
            setTimeout(onDone, 80);
          }
        }, startDelay + i * CHAR_DELAY);
      });
    }

    var titleDuration = titleChars.length * CHAR_DELAY;

    // 第一行開始
    typeChars(titleChars, 300, null);

    // 第二行：第一行打完 + LINE_GAP 後開始
    typeChars(subChars, 300 + titleDuration + LINE_GAP, function() {
      // 全部打完後觸發橘色掃入
      setTimeout(triggerSweep, AFTER_TYPED);
    });

    /* ── 橘色滿版掃入 → 跳轉 ── */
    function triggerSweep() {
      // 掃入（右至左：先覆蓋全畫面）
      sweep.classList.add('sweep-in');

      // 掃入完成 (1s) 後跳轉
      setTimeout(function() {
        window.location.href = 'index.html';
      }, 1020);
    }

    /* ── bfcache fix: only reset when restored from cache, not on first load ── */
    window.addEventListener('pageshow', function(e) {
      if (!e.persisted) return;  // 正常載入不處理，只處理 bfcache 還原
      var sweep = document.getElementById('sweep');
      if (sweep) {
        sweep.style.transition = 'none';
        sweep.style.clipPath = 'inset(0 100% 0 0)';
        sweep.style.display = '';
      }
    });

  </script>
